name: CI

on:
  push:
    branches: [ main, 'LTS-*' ]
  pull_request:
  workflow_dispatch:

# Least privilege: the test job only clones the repository and runs the suite.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The package has no runtime dependencies of its own; install the peer binding
      # for the integration tests. The floor is the value.hashKey() bridge; the upper
      # bound keeps the 1.2 line off a future 2.0 binding.
      - name: Install peer binding
        run: npm install --no-save "@digitalsubstrate/dsviper@>=1.2.8 <2"

      - name: Test
        run: npm test
